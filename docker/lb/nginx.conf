log_format lb '$remote_addr "$request" $status upstream=$upstream_addr';

server {
    listen 80;
    access_log /dev/stdout lb;

    # DNS internal Docker, diresolusi ulang tiap 5 detik supaya replika
    # yang ditambah atau dikurangi ikut terbaca.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $upstream http://model-serve:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header X-Served-By $upstream_addr always;
    }
}

services:
  # Database metadata MLflow
  postgres:
    image: postgres:16-alpine
    container_name: mlops_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mlops-net

  # MLflow tracking server dan model registry
  mlflow-server:
    build:
      context: ./docker/mlflow
    image: mlops-mlflow-server:3.17.1
    container_name: mlops_mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow-server:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - mlops-net

  # Pelatihan awal sekali jalan: mengisi registry jika masih kosong
  trainer:
    build:
      context: .
      dockerfile: docker/trainer/Dockerfile
    image: mlops-trainer:1.0
    container_name: mlops_trainer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      LOCAL_DATA_PATH: /data/data_processed_latest.parquet
    volumes:
      - ./data/processed:/data:ro
    depends_on:
      mlflow-server:
        condition: service_healthy
    restart: "no"
    networks:
      - mlops-net

  # API inferensi: memuat model Production dari MLflow Registry
  api-service:
    build:
      context: ./docker/api
    image: mlops-api-service:1.0
    container_name: mlops_api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MODEL_NAME: pm25-forecasting-xgboost
      MODEL_ALIAS: production
    ports:
      - "8000:8000"
    depends_on:
      mlflow-server:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - mlops-net

  # Model serving (MLflow Models) dengan beberapa replika
  model-serve:
    image: pm25-model-serve:1.0
    pull_policy: never  # image dibangun lokal: scripts/build_model_image.sh
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - mlops-net

  # Pintu masuk: membagi permintaan ke replika model-serve
  model-lb:
    image: nginx:1.27-alpine
    container_name: mlops_model_lb
    ports:
      - "8080:80"
    volumes:
      - ./docker/lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      model-serve:
        condition: service_healthy
    networks:
      - mlops-net


  # Metrics Gateway: mencatat metrik sebelum request diteruskan ke Nginx
  metrics-gateway:
    build:
      context: ./docker/metrics-gateway
    image: mlops-metrics-gateway:1.0
    container_name: mlops_metrics_gateway
    environment:
      NGINX_URL: http://model-lb:80
    ports:
      - "8081:8000"
    depends_on:
      model-lb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-net

  # Prometheus: mengumpulkan metrik secara berkala
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: mlops_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--storage.tsdb.retention.size=512MB"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - metrics-gateway
      - cadvisor
    networks:
      - mlops-net

  # cAdvisor: mengumpulkan metrik resource kontainer
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: mlops_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - mlops-net

  # Grafana: visualisasi metrik monitoring
  grafana:
    image: grafana/grafana:11.6.1
    container_name: mlops_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - mlops-net

  # Message Broker untuk Antrean Celery
  redis:
    image: redis:7-alpine
    container_name: mlops_redis
    ports:
      - "6379:6379"
    networks:
      - mlops-net

  # Object Storage (MinIO)
  minio:
    image: quay.io/minio/minio:latest
    container_name: mlops_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mlops-net

volumes:
  minio_data:
  pg_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

networks:
  mlops-net:
    driver: bridge
    name: mlops-net

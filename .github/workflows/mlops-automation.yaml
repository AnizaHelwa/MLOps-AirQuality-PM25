name: MLOps Automation

on:
  push:
    branches:
      - main
      - eksperimen/lk08-github-actions
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Job 1 - Automated Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Jalankan unit test
        run: python -m pytest -v
